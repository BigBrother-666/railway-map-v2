# 运行配置从 backend/config.yml 读取。字符串值支持 ${ENV} 环境变量展开。
# 缺失的环境变量展开为空字符串，再由后端填充默认值。
server:
  # HTTP 和 WebSocket 监听地址。 默认值：:8080。
  addr: ":8080"
  # 后端对外基础 URL，用于拼接微软 OAuth 回调地址，也用于 CORS 允许来源。 默认值：空。
  publicBaseUrl: "http://localhost:8080"
  # 微软登录回调完成后跳转回此处并弹出登录成功/失败提示。 默认值：server.publicBaseUrl。
  # 留空用于生产同源反代场景；开发时前端使用独立端口，需填写如 http://localhost:5173。
  frontendBaseUrl: ""

log:
  # 日志级别，可用 debug、info、warn、error。 默认值：info。
  level: "info"
  # 日志文件目录。相对路径按后端进程工作目录解析，默认即 backend/data/logs。 默认值：data/logs。
  dir: "data/logs"

# 插件 config_map.yml 对接示例：
# web-link:
#   enabled: true
#   backend-url: "ws://localhost:8080/internal/plugin"
#   shared-token: "change-me"
plugin:
  # 插件连接 /internal/plugin 的 Bearer token。 默认值：空。
  # 由 BCTS_PLUGIN_TOKEN 注入；必须与插件的 shared-token 一致。
  sharedToken: "${BCTS_PLUGIN_TOKEN}"

auth:
  microsoft:
    # Azure 应用 Client ID，为空时微软登录不可用。 默认值：空。
    # 由 MS_CLIENT_ID 注入。未配置且未启用测试登录时，地图、线路和实时公开数据仍可用，登录、购票与路线/车票查询不可用。
    clientId: "${MS_CLIENT_ID}"
    # Azure 应用 Client Secret。 默认值：空。
    # 由 MS_CLIENT_SECRET 注入。
    clientSecret: "${MS_CLIENT_SECRET}"
    # OAuth 回调路径，会与 server.publicBaseUrl 拼成完整回调 URL。 默认值：/api/v1/auth/callback。
    redirectPath: "/api/v1/auth/callback"
  # JWT 会话签名密钥。 默认值：空。
  # 由 BCTS_JWT_SECRET 注入。
  jwtSecret: "${BCTS_JWT_SECRET}"
  # 是否启用测试登录接口，仅测试环境使用。 默认值：false。
  testAuthEnabled: false
  # 允许测试登录的玩家 UUID 列表。 默认值：[]。
  testAuthUUIDs: [ ]
  # 初始超级管理员的 Minecraft UUID（带或不带横线均可）。启动时自动授予内置 super_admin 角色，网页端不可撤销。 默认值：空。
  # 由 BCTS_SUPER_ADMIN_UUID 注入；留空则没有超级管理员，无法进入权限管理 / 服务器配置。
  superAdminUuid: "${BCTS_SUPER_ADMIN_UUID}"

db:
  # 数据库类型，可选 mysql 或 sqlite。 默认值：mysql。
  # 由 BCTS_DB_DRIVER 注入，留空默认 mysql。使用 MySQL 时请先创建数据库和用户；也可切换为 SQLite。
  driver: "${BCTS_DB_DRIVER}"
  # MySQL DSN，仅 db.driver=mysql 时使用，建议用 ${BCTS_DB_DSN} 从环境变量注入。 默认值：bcts:change-me@tcp(127.0.0.1:3306)/bcts_web?...。
  # 由 BCTS_DB_DSN 注入，例如 bcts:password@tcp(127.0.0.1:3306)/bcts_web?charset=utf8mb4&parseTime=true&loc=Local。
  dsn: "${BCTS_DB_DSN}"
  # SQLite 数据库文件路径，仅 db.driver=sqlite 时使用。后端启动时会自动创建目录和表。 默认值：data/bcts-web.db。
  # 由 BCTS_DB_PATH 注入，例如 data/bcts-web.db。
  path: "${BCTS_DB_PATH}"
